apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  labels:
    llm-d.ai/role: decode
    llm-d.ai/guide: minikube-llm-d-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: decode
      llm-d.ai/guide: minikube-llm-d-cpu
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        llm-d.ai/guide: minikube-llm-d-cpu
    spec:
      containers:
        - name: modelserver
          image: VLLM_CPU_IMAGE
          command: ["vllm", "serve"]
          args:
            - "meta-llama/Llama-3.2-1B-Instruct"
            - "--dtype"
            - "auto"
            - "--enforce-eager"
            - "--max-model-len"
            - "2048"
            - "--enable-lora"
            - "--max-loras"
            - "3"
            - "--lora-modules"
            - '{"name":"ibm_z17_technical_technical_introduction","path":"SuryaSaiVenkatesh/z17-qa-Llama-3.2-1B-Instruct-adapter"}'
            - '{"name":"ansible_automation_ibm_power_env","path":"SuryaSaiVenkatesh/ansible-qa-Llama-3.2-1B-Instruct-adapter"}'
            - '{"name":"best_practices_ibm_storage_flash_system","path":"SuryaSaiVenkatesh/flash-qa-Llama-3.2-1B-Instruct-adapter"}'
            - "--port"
            - "8000"
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "3"
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 16Gi
          securityContext:
            capabilities:
              add:
                - SYS_NICE
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
