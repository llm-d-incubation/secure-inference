inferenceExtension:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  pluginsConfigFile: "minikube-llm-d-cpu-plugins.yaml"
  pluginsCustomConfig:
    minikube-llm-d-cpu-plugins.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: queue-scorer
          weight: 2
        - pluginRef: kv-cache-utilization-scorer
          weight: 2

inferencePool:
  modelServers:
    matchLabels:
      llm-d.ai/guide: "minikube-llm-d-cpu"
